<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hoang CHEAT - Key</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:#000; color:#f4f4f4;
  font-family:Arial,Helvetica,sans-serif; display:flex; align-items:center;
  justify-content:center; overflow:hidden;
}
body:before{
  content:""; position:fixed; inset:0;
  background:radial-gradient(circle at 50% 45%,#27101c 0,#09090c 35%,#000 70%);
  pointer-events:none;
}
.wrap{width:min(94vw,640px); position:relative; z-index:1}
.logo{
  width:108px;height:108px;margin:0 auto 35px;border:1px solid #813250;
  border-radius:28px;display:grid;place-items:center;
  background:linear-gradient(145deg,#15151d,#08080d);
  box-shadow:0 0 35px rgba(255,20,110,.12);
}
.logo span{font-size:62px;font-weight:800;color:#eee;text-shadow:0 0 10px #ff176c}
h1{text-align:center;font-size:34px;margin:0 0 8px;font-weight:800}
.sub{text-align:center;color:#d61d65;letter-spacing:5px;font-weight:700;font-size:13px;margin-bottom:35px}
.card{
  border:1px solid #343744;border-radius:32px;padding:32px;
  background:linear-gradient(145deg,rgba(27,29,38,.96),rgba(15,16,22,.96));
  box-shadow:0 20px 70px rgba(0,0,0,.5),0 0 45px rgba(255,0,100,.07);
}
.status{
  display:inline-block;padding:9px 15px;border-radius:20px;background:#08251a;
  color:#00d86a;border:1px solid #075b38;font-weight:700;font-size:13px;margin-bottom:28px
}
h2{font-size:25px;margin:0 0 8px}
.desc{color:#a8a9b0;margin:0 0 28px}
.label{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.label b{color:#b9bac2;font-size:13px;letter-spacing:2px}
.encrypted{color:#ef246d;background:#28111e;border:1px solid #5b1735;border-radius:14px;padding:7px 11px;font-size:11px;font-weight:700}
.input{
  display:flex;align-items:center;gap:14px;border:2px solid #a20e4b;
  border-radius:22px;padding:0 18px;height:74px;background:#171821;
}
.keyicon{font-size:25px;color:#e51c6c}
input{
  flex:1;background:none;border:0;outline:0;color:#eee;font-size:18px;
  font-family:monospace;min-width:0;
}
input::placeholder{color:#74757e}
button{
  width:100%;height:76px;margin-top:52px;border:0;border-radius:22px;
  background:linear-gradient(90deg,#f11a69,#d70b60);color:white;
  font-size:20px;font-weight:800;cursor:pointer;
  box-shadow:0 10px 30px rgba(225,0,90,.18)
}
.msg{text-align:center;color:#ff4d8d;min-height:22px;margin-top:14px;font-size:13px}
.footer{text-align:center;color:#666771;font-size:12px;letter-spacing:3px;margin-top:32px}
@media(max-width:500px){h1{font-size:28px}.card{padding:25px}h2{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><span>H</span></div>
  <h1>HOANG CHEAT</h1>
  <div class="sub">HOANG CHEAT EDITION</div>

  <div class="card">
    <div class="status">● SISTEMA LISTO</div>
    <h2>TRUY CẬP HOANG CHEAT</h2>
    <p class="desc">Nhập license key để mở bảng điều khiển</p>

    <div class="label">
      <b>LLAVE DE LICENCIA</b>
      <span class="encrypted">ACCESO ENCRIPTADO</span>
    </div>

    <div class="input">
      <span class="keyicon">⚿</span>
      <input id="key" type="password" placeholder="Nhập key tại đây">
      <span>◉</span>
    </div>

    <button onclick="login()">ĐĂNG NHẬP</button>
    <div id="msg" class="msg"></div>
  </div>

  <div class="footer">HOANG CHEAT / SESIÓN PROTEGIDA</div>
</div>

<script>
const VALID_KEY = "HOANG-CHEAT";
function login(){
  const key=document.getElementById("key").value.trim();
  const msg=document.getElementById("msg");
  if(key===VALID_KEY){
    sessionStorage.setItem("hoang_ok","1");
    location.href="start.html";
  }else{
    msg.textContent="Key không đúng.";
  }
}
document.getElementById("key").addEventListener("keydown",e=>{
  if(e.key==="Enter") login();
});
</script>
</body>
</html>
